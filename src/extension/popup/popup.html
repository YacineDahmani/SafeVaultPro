<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SafeVaultPro</title>
	<link rel="stylesheet" href="popup.css">
</head>
<body>
	<div class="popup-container">
		<!-- Header -->
		<header class="popup-header">
			<div class="brand">
				<div class="shield-logo">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
						<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
					</svg>
				</div>
				<span class="title">SafeVaultPro</span>
			</div>
			<div class="status-indicator" id="statusPill">
				<span class="status-dot"></span>
				<span class="status-text" id="statusText">Connecting...</span>
			</div>
		</header>

		<!-- Navigation Tabs -->
		<nav class="popup-tabs">
			<button class="tab-btn active" data-tab="matchedTab">Matched</button>
			<button class="tab-btn" data-tab="searchTab">Search</button>
			<button class="tab-btn" data-tab="generatorTab">Generator</button>
		</nav>

		<!-- Tab Contents -->
		<main class="popup-content">
			<!-- Matched Items Tab -->
			<div class="tab-pane active" id="matchedTab">
				<div class="domain-banner" id="domainBanner">Current domain: <span id="currentDomainText">detecting...</span></div>
				<div class="items-list" id="matchedList">
					<div class="loading-state">Scanning matched credentials...</div>
				</div>
			</div>

			<!-- Search Tab -->
			<div class="tab-pane" id="searchTab">
				<div class="search-box">
					<input type="text" id="searchInput" placeholder="Search vault items..." />
				</div>
				<div class="items-list" id="searchList">
					<div class="empty-state">Type to search items...</div>
				</div>
			</div>

			<!-- Generator Tab -->
			<div class="tab-pane" id="generatorTab">
				<div class="generator-card">
					<div class="password-display">
						<span id="genPasswordText">Click Generate</span>
						<button id="copyGenBtn" title="Copy Password">Copy</button>
					</div>
					<div class="entropy-bar-container">
						<div class="entropy-bar" id="entropyBar"></div>
					</div>
					<div class="generator-controls">
						<div class="control-row">
							<label>Length (<span id="lenValue">16</span>)</label>
							<input type="range" id="lengthSlider" min="8" max="64" value="16">
						</div>
						<div class="checkbox-grid">
							<label><input type="checkbox" id="chkUpper" checked> A-Z</label>
							<label><input type="checkbox" id="chkNumbers" checked> 0-9</label>
							<label><input type="checkbox" id="chkSymbols" checked> !@#$</label>
						</div>
						<button class="btn-primary" id="generateBtn">Generate Password</button>
					</div>
				</div>
			</div>
		</main>

		<!-- Footer -->
		<footer class="popup-footer">
			<span id="footerMsg">SafeVaultPro Desktop Bridge v1.0</span>
		</footer>
	</div>

	<script src="popup.js"></script>
</body>
</html>
